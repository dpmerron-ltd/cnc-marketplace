<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>888Group · Scan part</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: var(--tg-theme-bg-color, #f5f7fb); color: var(--tg-theme-text-color, #172033); }
    body { margin: 0; padding: 28px 20px; }
    main { max-width: 440px; margin: auto; }
    .icon { font-size: 42px; margin: 16px 0; }
    h1 { font-size: 28px; margin: 0 0 10px; }
    p { line-height: 1.55; }
    .muted { color: var(--tg-theme-hint-color, #697386); }
    button { width: 100%; border: 0; border-radius: 12px; padding: 15px; font: inherit; font-weight: 650; background: var(--tg-theme-button-color, #2563eb); color: var(--tg-theme-button-text-color, white); cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    input { width: 100%; box-sizing: border-box; font: inherit; border: 1px solid #8793a6; border-radius: 8px; padding: 12px; margin: 10px 0; background: var(--tg-theme-secondary-bg-color, white); color: inherit; }
    details { border-top: 1px solid #8793a644; margin-top: 28px; padding-top: 20px; }
    summary { cursor: pointer; }
    #status { min-height: 48px; }
    progress { width: 100%; }
    [hidden] { display: none !important; }
    #camera-box { position: relative; overflow: hidden; border-radius: 18px; background: #111827; aspect-ratio: 1; }
    video { width: 100%; height: 100%; object-fit: contain; }
    #confirmation { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: white; background: #15803de8; pointer-events: none; }
    #confirmation[data-kind="error"] { background: #b91c1ce8; }
    #confirmation[data-kind="warning"] { background: #92400ee8; }
    #confirmation-icon { font-size: 110px; line-height: 1; }
    #confirmation-text { font-size: 24px; font-weight: 750; margin-top: 12px; }
    #status { white-space: pre-line; }
    #mode-description { padding: 12px; border-radius: 10px; background: #15803d22; font-weight: 650; }
    body[data-mode="failed"] #mode-description { background: #b4530922; border: 2px solid #b45309; }
    #count { font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📷</div>
    <h1>Scan a part</h1>
    <p id="mode-description">Preparing scan mode…</p>
    <section id="camera-box" aria-label="Live QR camera" hidden>
      <video id="camera" autoplay muted playsinline></video>
      <div id="confirmation" role="status" aria-live="polite" hidden><span id="confirmation-icon"></span><span id="confirmation-text"></span></div>
    </section>
    <canvas id="frame" hidden></canvas>
    <button id="scan" type="button">Start camera</button>
    <p id="status" role="status" aria-live="polite">Preparing the scanner…</p>
    <progress id="loading" aria-label="Saving scan" hidden></progress>
    <details>
      <summary>Enter an ID instead</summary>
      <form id="manual">
        <label for="part-id">Full ID printed below the QR code</label>
        <input id="part-id" autocomplete="off" autocapitalize="none" spellcheck="false" required placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
        <button id="lookup" type="submit">Submit part ID</button>
      </form>
    </details>
    <p id="count" class="muted">Ready for your first scan</p>
  </main>
  <script src="./qr-decoder.js"></script>
  <script src="./part-scanner.js"></script>
</body>
</html>
