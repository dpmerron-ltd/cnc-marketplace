name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: account_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: account_tests
    steps:
      - uses: actions/checkout@v5
      - name: Verify account isolation in PostgreSQL
        run: |
          psql --set ON_ERROR_STOP=on --file supabase/tests/setup.sql
          psql --set ON_ERROR_STOP=on --file supabase/schema.sql
          psql --set ON_ERROR_STOP=on --file supabase/schema.sql
          psql --set ON_ERROR_STOP=on --file supabase/api.sql
          psql --set ON_ERROR_STOP=on --file supabase/api.sql
          psql --set ON_ERROR_STOP=on --file supabase/tests/account-isolation.sql
          psql --set ON_ERROR_STOP=on --file supabase/tests/api-isolation.sql
          psql --set ON_ERROR_STOP=on --file supabase/tests/program-settings-isolation.sql
          psql --set ON_ERROR_STOP=on --file supabase/tests/box-stock-isolation.sql

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build API
        run: npm run build:api

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  schema:
    needs: [build, database-tests]
    uses: ./.github/workflows/apply-supabase-schema.yml
    secrets: inherit

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, schema]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
