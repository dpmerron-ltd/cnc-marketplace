name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      schema: ${{ steps.changed.outputs.schema }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check schema changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "push" ] || [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "schema=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- supabase/schema.sql supabase/api.sql supabase/orders.sql; then
            echo "schema=false" >> "$GITHUB_OUTPUT"
          else
            echo "schema=true" >> "$GITHUB_OUTPUT"
          fi

  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: account_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: account_tests
    steps:
      - uses: actions/checkout@v5
      - name: Verify account isolation in PostgreSQL
        run: |
          psql --set ON_ERROR_STOP=on --file supabase/tests/setup.sql
          psql --set ON_ERROR_STOP=on --file supabase/schema.sql
          psql --set ON_ERROR_STOP=on --file supabase/schema.sql
          psql --set ON_ERROR_STOP=on --file supabase/api.sql
          psql --set ON_ERROR_STOP=on --file supabase/api.sql
          psql --set ON_ERROR_STOP=on --file supabase/orders.sql
          psql --set ON_ERROR_STOP=on --file supabase/orders.sql
          psql --set ON_ERROR_STOP=on --file supabase/tests/order-assignment-isolation.sql
          psql --set ON_ERROR_STOP=on --file supabase/tests/account-isolation.sql
          psql --set ON_ERROR_STOP=on --file supabase/tests/api-isolation.sql
          psql --set ON_ERROR_STOP=on --file supabase/tests/program-settings-isolation.sql
          psql --set ON_ERROR_STOP=on --file supabase/tests/box-stock-isolation.sql
          psql --set ON_ERROR_STOP=on --file supabase/tests/component-program-protection.sql

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build API
        run: npm run build:api

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  schema:
    needs: [build, database-tests, changes]
    if: needs.changes.outputs.schema == 'true'
    uses: ./.github/workflows/apply-supabase-schema.yml
    secrets: inherit

  deploy:
    if: always() && needs.build.result == 'success' && needs.database-tests.result == 'success' && needs.changes.result == 'success' && (needs.schema.result == 'success' || needs.schema.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, database-tests, changes, schema]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
