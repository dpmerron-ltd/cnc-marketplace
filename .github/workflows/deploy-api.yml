name: Deploy CNC API
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy GitHub Pages]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cnc-api-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Check deployment credentials
        id: credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::API deployment skipped. Deploy locally after supabase login, or configure SUPABASE_ACCESS_TOKEN for automated deployments."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.credentials.outputs.configured == 'true'
      - run: npm run build:api
        if: steps.credentials.outputs.configured == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.configured == 'true'
        with:
          version: latest
      - run: supabase functions deploy cnc-api --project-ref bsnndtwbvgrthddmbhoa --use-api
        if: steps.credentials.outputs.configured == 'true'
